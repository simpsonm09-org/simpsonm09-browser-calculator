[tools]

# Task runner
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
python = "3.12"

# Linters
"aqua:grafana/flint" = "0.22.14"
ruff = "0.16.9"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.deps]
description = "Install the Python dependencies and the browser for local runs and tests"
run = [
    'python -m pip install -e ".[test]"',
    "python -m playwright install chromium",
]

[tasks.test]
description = "Run the tests"
run = "python -m pytest"

[tasks.serve]
description = "Serve the calculator on http://127.0.0.1:8000"
run = "python -m browser_calculator --host 127.0.0.1 --port 8000"
