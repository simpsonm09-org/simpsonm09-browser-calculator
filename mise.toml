[tools]

# Task runner
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
node = "26"

# Linters
"aqua:grafana/flint" = "0.22.14"
biome = "2.5.14"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the test suite"
run = "npm test"

[tasks.serve]
description = "Serve the calculator on http://127.0.0.1:8000"
run = "node src/server.js --host 127.0.0.1 --port 8000"
