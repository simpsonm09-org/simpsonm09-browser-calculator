openapi: 3.1.0
info:
  title: Browser Calculator API
  version: 0.1.0
  description: Evaluate a single arithmetic expression.
paths:
  /api/evaluate:
    post:
      summary: Evaluate an arithmetic expression.
      operationId: evaluateExpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expression
              properties:
                expression:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: The evaluated result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - expression
                  - result
                properties:
                  expression:
                    type: string
                  result:
                    type: number
        "400":
          description: The expression is empty, malformed, or not arithmetic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "422":
          description: The request body failed validation.
  /healthz:
    get:
      summary: Report that the service is up.
      operationId: health
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
