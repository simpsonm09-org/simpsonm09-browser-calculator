[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-calculator"
version = "0.1.0"
description = "A light example built from repo-template: a browser calculator served by FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.scripts]
browser-calculator = "browser_calculator.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytest-playwright>=0.5", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_calculator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
